name: Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          # A PR must not allowlist its own secret: rules come from the base branch, and it can't add .gitleaksignore.
          config="$RUNNER_TEMP/gitleaks.toml"
          cp .gitleaks.toml "$config"
          if [ -n "$GITHUB_BASE_REF" ]; then
            git show "origin/$GITHUB_BASE_REF:.gitleaks.toml" > "$config" 2>/dev/null || cp .gitleaks.toml "$config"
            if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qx .gitleaksignore; then
              echo "::error::.gitleaksignore changes are reviewed outside CI"
              exit 1
            fi
          fi
          docker run --rm -v "$PWD:/repo" -v "$config:/gitleaks.toml:ro" "$IMAGE" git --config /gitleaks.toml --no-banner --redact --ignore-gitleaks-allow /repo

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fallow audit diffs against the base branch
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight
        env:
          FALLOW_AUDIT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
